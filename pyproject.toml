[project]
name = "mcqsnap"
version = "0.1.0"
description = "AI-powered tool to capture screenshots of multiple-choice questions (MCQs) and instantly identify the correct answer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.84.0",
    "pyside6>=6.8.1",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "nuitka>=2.5.6",
]
